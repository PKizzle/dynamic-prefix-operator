# Access to the kube-vip cloud provider's pool ConfigMap.
#
# Deliberately not part of the default kustomization, and deliberately not a
# rule in the generated ClusterRole: the CRD backends need no access to
# ConfigMaps at all, and cluster-wide write access to every ConfigMap in the
# cluster is a much larger grant than any of them asks for. A deployment that
# does not use kube-vip should not be carrying it.
#
# To enable the backend:
#   1. Set the namespace below to wherever the kube-vip ConfigMap lives, and
#      apply this file alongside the rest of config/rbac.
#   2. Pass --kubevip-configmap=<namespace>/<name> to the manager.
#   3. Annotate the ConfigMap with dynamic-prefix.io/name and
#      dynamic-prefix.io/kubevip-key.
#
# The Helm chart does all three from `kubevip.enabled`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dynamic-prefix-operator-kubevip
  namespace: kube-system
  labels:
    app.kubernetes.io/name: dynamic-prefix-operator
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dynamic-prefix-operator-kubevip
  namespace: kube-system
  labels:
    app.kubernetes.io/name: dynamic-prefix-operator
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dynamic-prefix-operator-kubevip
subjects:
  - kind: ServiceAccount
    name: dynamic-prefix-operator-controller-manager
    namespace: dynamic-prefix-operator-system
