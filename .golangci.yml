version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - errcheck
    # errorlint: this codebase wraps errors and inspects them at boundaries, so
    # a comparison with == against a wrapped error is a silent behaviour change.
    - errorlint
    - ginkgolinter
    - goconst
    - gocyclo
    # gosec: the operator parses untrusted ICMPv6 and DHCPv6 off the wire and
    # runs with NET_RAW, which is exactly the profile this linter is for.
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    # nilerr: returning nil after checking an error is how this project's
    # swallowed-error bugs looked, twice.
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      # Listing rules replaces revive's defaults, so the defaults are listed
      # too.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
          # Ginkgo and Gomega are DSLs written to be dot-imported.
          arguments:
            - allowed-packages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      # controller-gen reads a marker from one comment line, so a
      # +kubebuilder marker carrying a CEL rule and its message cannot wrap.
      - linters:
          - lll
        source: '^\s*// \+kubebuilder:'
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
