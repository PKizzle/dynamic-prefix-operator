version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - errcheck
    # errorlint: this codebase wraps errors and inspects them at boundaries, so
    # a comparison with == against a wrapped error is a silent behaviour change.
    - errorlint
    - ginkgolinter
    - goconst
    - gocyclo
    # gosec: the operator parses untrusted ICMPv6 and DHCPv6 off the wire and
    # runs with NET_RAW, which is exactly the profile this linter is for.
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    # nilerr: returning nil after checking an error is how this project's
    # swallowed-error bugs looked, twice.
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - lll
        path: internal/*
      # dupl stays off for tests, where near-identical table cases and fixtures
      # are the point. It is on for production code: the three pool backends
      # each carried their own copy of the same shared-list sync, and the copies
      # drifted -- MetalLB spent a release deciding ownership geometrically
      # after the others had moved to records, leaking an address per rotation.
      - linters:
          - dupl
        path: _test\.go$
      # gosec's subprocess and integer-conversion rules are about untrusted
      # input reaching a shell or an overflow. Test helpers shell out to kubectl
      # with values the test itself chose, and test fixtures build byte arrays
      # from constants; neither is the threat this operator has.
      - linters:
          - gosec
        path: (_test\.go|^test/utils/)
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
