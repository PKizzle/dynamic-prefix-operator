name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Least privilege by default, so a job added later has to ask for more rather
# than inherit whatever the repository default happens to be. This workflow is
# the one holding packages: write and id-token: write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Done in shell rather than with a third-party action: this job holds
      # packages:write, and lowercasing a string is not worth an external
      # dependency inside it.
      - name: Convert repository name to lowercase
        id: image_name
        run: echo "lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.9.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform short name
        id: platform
        run: |
          platform=${{ matrix.platform }}
          echo "short=${platform#linux/}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.9.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}
          # Suffix tags with architecture for per-arch pulls
          flavor: |
            suffix=-${{ steps.platform.outputs.short }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          platforms: ${{ matrix.platform }}
          # Left off here on purpose. These are per-platform builds whose
          # digests are merged into one index by `imagetools create` below, and
          # that merge carries image manifests only -- buildx attestations would
          # be built and then dropped. The published tags are signed and given
          # an SBOM after the merge instead, where both survive.
          provenance: false

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ steps.platform.outputs.short }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Create multi-arch manifest after all platform builds complete
  manifest:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing exchanges this for a short-lived certificate; no
      # signing key is stored anywhere.
      id-token: write

    steps:
      # Done in shell rather than with a third-party action: this job holds
      # packages:write, and lowercasing a string is not worth an external
      # dependency inside it.
      - name: Convert repository name to lowercase
        id: image_name
        run: echo "lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.9.0

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for manifest
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.9.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}@sha256:%s ' *)

      # The Rust nydusify (PKizzle/nydus fork) is required: it is the only one
      # with --attach-oci-manifest, which publishes the OCI and nydus manifests
      # under ONE tag instead of a separate `-nydus` tag. Upstream's Go tool
      # cannot do this. No release artifacts are published for the fork, so we
      # build the two binaries we need from source (cached between runs).
      # Pinned to a commit, not the branch. This checkout is built from source
      # and then executed in a job that holds packages:write and an
      # authenticated GHCR session, so anyone able to push to that branch could
      # otherwise reach this project's published images. Bump deliberately.
      - name: Check out Nydus fork
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: PKizzle/nydus
          ref: 69c678de9cab5cc5ee57f2441216141d896834f7 # production
          path: .nydus-src

      - name: Cache Nydus build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .nydus-src

      - name: Build Nydus tools from fork
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .nydus-src
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake pkg-config liblz4-dev libz-dev uuid-dev protobuf-compiler

          # rust-toolchain.toml in the fork pins the toolchain; cargo installs it on demand.
          cargo build --release -p nydusify --bin nydusify
          cargo build --release --bin nydus-image

          sudo install -m 0755 target/release/nydusify /usr/local/bin/nydusify
          sudo install -m 0755 target/release/nydus-image /usr/local/bin/nydus-image

          nydusify --version

      - name: Attach Nydus manifest to image tags (dual image)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if (( ${#tags[@]} == 0 )); then
            echo "::error::No image tags found in Docker metadata output"
            exit 1
          fi

          # --attach-oci-manifest converts ONE platform per invocation and
          # preserves every entry already in the source index, so iterating the
          # platforms accumulates a nydus sibling per architecture on the same
          # tag. The preceding manifest step recreates each tag as a plain OCI
          # index first, so a re-run never stacks duplicate nydus entries.
          #
          # --oci-ref (zran) makes the nydus half reference the OCI half's gzip
          # layers instead of duplicating them: ~3-5% extra registry storage
          # rather than ~100%. The usual "source layers must persist" caveat
          # does not apply here because both halves live under the same tag.
          echo "## Dual images (OCI + nydus under one tag)" >> "$GITHUB_STEP_SUMMARY"
          for image in "${tags[@]}"; do
            for platform in linux/amd64 linux/arm64; do
              echo "Attaching nydus manifest for ${platform} to ${image}"
              DOCKER_CONFIG="$HOME/.docker" nydusify convert \
                --source "$image" \
                --target "$image" \
                --platform "$platform" \
                --attach-oci-manifest \
                --oci-ref
            done
            echo "- ${image}" >> "$GITHUB_STEP_SUMMARY"
          done

      # Everything below runs after the tags carry their final content -- the
      # merged index plus, on a release, the nydus siblings -- so what is signed
      # and inventoried is exactly what a user pulls.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.2

      - name: Sign the published images
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for image in "${tags[@]}"; do
            # By digest, not by tag: signing a tag signs whatever it points at
            # now, and the point of the signature is to bind this content.
            digest="$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "$image")"
            repository="${image%%:*}"
            echo "Signing ${repository}@${digest}"
            cosign sign "${repository}@${digest}"
          done

      - name: Generate an SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.9.0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          upload-artifact: true
          # Attaching to the GitHub Release needs contents:write, and this job
          # builds and runs the nydus fork from source -- it should not also be
          # able to write to the repository. The SBOM goes to the registry
          # instead, next to the image it describes, which is where a consumer
          # can actually find it.
          upload-release-assets: false

      - name: Attach the SBOM to the image
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for image in "${tags[@]}"; do
            digest="$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "$image")"
            repository="${image%%:*}"
            cosign attest --predicate sbom.spdx.json --type spdxjson "${repository}@${digest}"
          done

      # The image is scanned as published, after the nydus attach, so the scan
      # covers what is actually distributed. It reports rather than blocks:
      # govulncheck already gates on reachable vulnerabilities in this module's
      # own code, and a base-image CVE with no fix available should not make a
      # release unpublishable.
      - name: Scan the published image
        continue-on-error: true
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}:${{ steps.meta.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
