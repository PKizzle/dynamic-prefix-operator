name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        id: image_name
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform short name
        id: platform
        run: |
          platform=${{ matrix.platform }}
          echo "short=${platform#linux/}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}
          # Suffix tags with architecture for per-arch pulls
          flavor: |
            suffix=-${{ steps.platform.outputs.short }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          platforms: ${{ matrix.platform }}
          provenance: false

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.short }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Create multi-arch manifest after all platform builds complete
  manifest:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Convert repository name to lowercase
        id: image_name
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for manifest
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}@sha256:%s ' *)

      # The Rust nydusify (PKizzle/nydus fork) is required: it is the only one
      # with --attach-oci-manifest, which publishes the OCI and nydus manifests
      # under ONE tag instead of a separate `-nydus` tag. Upstream's Go tool
      # cannot do this. No release artifacts are published for the fork, so we
      # build the two binaries we need from source (cached between runs).
      - name: Check out Nydus fork
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4
        with:
          repository: PKizzle/nydus
          ref: production
          path: .nydus-src

      - name: Cache Nydus build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .nydus-src

      - name: Build Nydus tools from fork
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .nydus-src
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake pkg-config liblz4-dev libz-dev uuid-dev protobuf-compiler

          # rust-toolchain.toml in the fork pins the toolchain; cargo installs it on demand.
          cargo build --release -p nydusify --bin nydusify
          cargo build --release --bin nydus-image

          sudo install -m 0755 target/release/nydusify /usr/local/bin/nydusify
          sudo install -m 0755 target/release/nydus-image /usr/local/bin/nydus-image

          nydusify --version

      - name: Attach Nydus manifest to image tags (dual image)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if (( ${#tags[@]} == 0 )); then
            echo "::error::No image tags found in Docker metadata output"
            exit 1
          fi

          # --attach-oci-manifest converts ONE platform per invocation and
          # preserves every entry already in the source index, so iterating the
          # platforms accumulates a nydus sibling per architecture on the same
          # tag. The preceding manifest step recreates each tag as a plain OCI
          # index first, so a re-run never stacks duplicate nydus entries.
          #
          # --oci-ref (zran) makes the nydus half reference the OCI half's gzip
          # layers instead of duplicating them: ~3-5% extra registry storage
          # rather than ~100%. The usual "source layers must persist" caveat
          # does not apply here because both halves live under the same tag.
          echo "## Dual images (OCI + nydus under one tag)" >> "$GITHUB_STEP_SUMMARY"
          for image in "${tags[@]}"; do
            for platform in linux/amd64 linux/arm64; do
              echo "Attaching nydus manifest for ${platform} to ${image}"
              DOCKER_CONFIG="$HOME/.docker" nydusify convert \
                --source "$image" \
                --target "$image" \
                --platform "$platform" \
                --attach-oci-manifest \
                --oci-ref
            done
            echo "- ${image}" >> "$GITHUB_STEP_SUMMARY"
          done
