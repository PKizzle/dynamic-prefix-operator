name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.11.4

  install-parity:
    name: Install parity
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.1

      # Through the Makefile, so this job and a local `make build-installer`
      # cannot render the manifests with different kustomize versions.
      - name: Set up Kustomize
        run: |
          set -euo pipefail
          make kustomize
          echo "$PWD/bin" >> "$GITHUB_PATH"

      # The chart has drifted weaker than the kustomize install three times, in
      # the same direction, in the path most people use. This asserts the
      # properties that must not silently weaken.
      - name: Check chart and kustomize security posture
        run: ./hack/check-install-parity.sh

