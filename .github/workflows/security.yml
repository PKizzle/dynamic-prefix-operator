name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Advisories land against versions that are already released, so a run only
  # on push would leave a newly disclosed vulnerability unreported until the
  # next commit.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # govulncheck reports only vulnerabilities whose affected symbols are
      # actually reachable from this module, so a finding here is a real call
      # path rather than a version match in the dependency graph.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
