name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Advisories land against versions that are already released, so a run only
  # on push would leave a newly disclosed vulnerability unreported until the
  # next commit.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # govulncheck reports only vulnerabilities whose affected symbols are
      # actually reachable from this module, so a finding here is a real call
      # path rather than a version match in the dependency graph.
      - name: Run govulncheck
        env:
          # Pinned rather than @latest: an unpinned tool install is an
          # unreviewed dependency fetched into every run, including scheduled
          # ones nobody is watching. Dependabot cannot see a version in a run
          # step, so this needs bumping by hand -- and it has to keep pace with
          # the toolchain in go.mod, since the analyzer loads these sources.
          GOVULNCHECK_VERSION: v1.6.0
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...
