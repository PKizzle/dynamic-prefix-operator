{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dynamic-prefix-operator.fullname" . }}
  labels:
    {{- include "dynamic-prefix-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dynamic-prefix-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.config.metrics.enabled }}
    # Allow metrics scraping. Taken from the bind address rather than fixed, or
    # enabling the policy blocks every scrape the moment the port is changed --
    # or, as with the move to a secure listener, changes underneath it.
    - ports:
        - port: {{ include "dynamic-prefix-operator.metricsPort" . | int }}
          protocol: TCP
    {{- end }}
    # Allow health probes
    - ports:
        - port: 8081
          protocol: TCP
    # DHCPv6 replies arrive on the client port. Most CNIs do not apply
    # NetworkPolicy to a hostNetwork pod, so with the default network settings
    # this rule is inert -- it is here for the deployment that turns hostNetwork
    # off and relays DHCPv6 into the pod network.
    - ports:
        - port: 546
          protocol: UDP
    {{- with .Values.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow communication with kube-apiserver
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # DHCPv6-PD: SOLICIT/REQUEST/RENEW/REBIND go to servers and relay agents on
    # the server port. Inert under hostNetwork, as with the matching ingress rule.
    - ports:
        - port: 547
          protocol: UDP
    {{- with .Values.networkPolicy.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
