apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dynamic-prefix-operator.fullname" . }}
  labels:
    {{- include "dynamic-prefix-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dynamic-prefix-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dynamic-prefix-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dynamic-prefix-operator.serviceAccountName" . }}
      {{- if .Values.network.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ .Values.network.dnsPolicy | default "ClusterFirstWithHostNet" }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "dynamic-prefix-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.config.leaderElection.enabled }}
            - --leader-elect=true
            {{- end }}
            {{- if .Values.config.metrics.enabled }}
            - --metrics-bind-address={{ .Values.config.metrics.bindAddress }}
            - --metrics-secure={{ .Values.config.metrics.secure }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            - --health-probe-bind-address={{ .Values.config.health.bindAddress }}
            - --zap-devel={{ .Values.config.logDevelopment }}
            - --zap-encoder={{ .Values.config.logEncoder }}
            - --zap-log-level={{ .Values.config.logLevel }}
            {{- /*
            Quote the WHOLE argument, not just the value. `--flag={{ . | quote }}` renders
            `- --flag="value"` as a YAML plain scalar, so the quotes are part of the string
            the process receives and land inside the parsed value.
            */}}
            {{- with .Values.config.serviceSync.cacheLabelSelector }}
            - {{ printf "--service-cache-label-selector=%s" . | quote }}
            {{- end }}
            {{- with .Values.config.serviceSync.externalDNSTargetAnnotationKeys }}
            - {{ printf "--external-dns-target-annotation-keys=%s" (join "," .) | quote }}
            {{- end }}
            {{- if .Values.kubevip.enabled }}
            - --kubevip-configmap={{ .Values.kubevip.configMap.namespace }}/{{ .Values.kubevip.configMap.name }}
            {{- end }}
            {{- with .Values.crowdsec }}
            {{- if .enabled }}
            {{- $password := .passwordSecret.name }}
            {{- $clientCert := and .tls.secretName .tls.clientCertificate (not $password) }}
            {{- if not (or $clientCert $password) }}
            {{- fail "crowdsec.enabled needs crowdsec.tls.secretName (client certificate) or crowdsec.passwordSecret.name" }}
            {{- end }}
            - {{ printf "--crowdsec-lapi-url=%s" (required "crowdsec.lapiURL is required" .lapiURL) | quote }}
            - {{ printf "--crowdsec-dynamic-prefixes=%s" (join "," (required "crowdsec.dynamicPrefixes is required" .dynamicPrefixes)) | quote }}
            - --crowdsec-max-markers={{ .maxMarkers }}
            {{- if .tls.secretName }}
            - --crowdsec-ca-file=/etc/dynamic-prefix-operator/crowdsec/tls/ca.crt
            {{- end }}
            {{- if $clientCert }}
            - --crowdsec-cert-file=/etc/dynamic-prefix-operator/crowdsec/tls/tls.crt
            - --crowdsec-key-file=/etc/dynamic-prefix-operator/crowdsec/tls/tls.key
            {{- end }}
            {{- if $password }}
            - {{ printf "--crowdsec-machine-id=%s" (required "crowdsec.passwordSecret.machineID is required" .passwordSecret.machineID) | quote }}
            - --crowdsec-password-file=/etc/dynamic-prefix-operator/crowdsec/password/{{ .passwordSecret.key }}
            {{- end }}
            {{- if .lapiService.name }}
            - --crowdsec-lapi-service={{ .lapiService.namespace }}/{{ .lapiService.name }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- if .Values.crowdsec.enabled }}
          volumeMounts:
            {{- if .Values.crowdsec.tls.secretName }}
            - name: crowdsec-tls
              mountPath: /etc/dynamic-prefix-operator/crowdsec/tls
              readOnly: true
            {{- end }}
            {{- if .Values.crowdsec.passwordSecret.name }}
            - name: crowdsec-password
              mountPath: /etc/dynamic-prefix-operator/crowdsec/password
              readOnly: true
            {{- end }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- if .Values.config.metrics.enabled }}
            - name: metrics
              containerPort: {{ include "dynamic-prefix-operator.metricsPort" . }}
              protocol: TCP
            {{- end }}
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.crowdsec.enabled }}
      # Mounted as directories, not subPath files, so a renewed Secret reaches
      # the running pod and the next LAPI connection presents it.
      volumes:
        {{- if .Values.crowdsec.tls.secretName }}
        - name: crowdsec-tls
          secret:
            secretName: {{ .Values.crowdsec.tls.secretName }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.crowdsec.passwordSecret.name }}
        - name: crowdsec-password
          secret:
            secretName: {{ .Values.crowdsec.passwordSecret.name }}
            defaultMode: 0400
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 10
