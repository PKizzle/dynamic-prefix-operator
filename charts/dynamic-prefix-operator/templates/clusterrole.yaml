{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dynamic-prefix-operator.fullname" . }}
  labels:
    {{- include "dynamic-prefix-operator.labels" . | nindent 4 }}
rules:
  # DynamicPrefix CRD permissions
  - apiGroups:
      - dynamic-prefix.io
    resources:
      - dynamicprefixes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - dynamic-prefix.io
    resources:
      - dynamicprefixes/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - dynamic-prefix.io
    resources:
      - dynamicprefixes/finalizers
    verbs:
      - update

  # CiliumLoadBalancerIPPool permissions
  - apiGroups:
      - cilium.io
    resources:
      - ciliumloadbalancerippools
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - cilium.io
    resources:
      - ciliumloadbalancerippools/status
    verbs:
      - get

  # CiliumCIDRGroup permissions
  - apiGroups:
      - cilium.io
    resources:
      - ciliumcidrgroups
    verbs:
      - get
      - list
      - patch
      - update
      - watch

  # CiliumBGPAdvertisement permissions (for BGP subnet mode)
  - apiGroups:
      - cilium.io
    resources:
      - ciliumbgpadvertisements
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # MetalLB IPAddressPool permissions
  - apiGroups:
      - metallb.io
    resources:
      - ipaddresspools
    verbs:
      - get
      - list
      - patch
      - update
      - watch

  # Calico IPPool permissions. create/delete are needed on top of the usual verbs:
  # spec.cidr holds exactly one prefix, so a draining prefix has to live in a
  # separate IPPool that the operator creates when the delegation rotates and
  # removes once that prefix leaves the history window.
  - apiGroups:
      - projectcalico.org
    resources:
      - ippools
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Service permissions (for HA mode)
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - patch
      - update
      - watch

  # Leader election permissions
  {{- if .Values.config.leaderElection.enabled }}
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  {{- end }}

  # Events permissions. Both groups are required: the operator emits through
  # events.k8s.io/v1, while controller-runtime's leader election still records
  # to the legacy core/v1 Event API.
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch

  {{- with .Values.rbac.additionalRules }}
  # Additional custom rules
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
