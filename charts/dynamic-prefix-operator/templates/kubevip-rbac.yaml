{{- if and .Values.rbac.create .Values.kubevip.enabled -}}
# Access to the kube-vip cloud provider's pool ConfigMap.
#
# A namespaced Role, and only when the backend is enabled. The CRD backends need
# no access to ConfigMaps at all, and a ClusterRole granting write access to
# every ConfigMap in the cluster is a much larger grant than any of them asks
# for -- ConfigMaps are where a great deal of other software keeps things it
# would rather nobody rewrote.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dynamic-prefix-operator.fullname" . }}-kubevip
  namespace: {{ .Values.kubevip.configMap.namespace }}
  labels:
    {{- include "dynamic-prefix-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dynamic-prefix-operator.fullname" . }}-kubevip
  namespace: {{ .Values.kubevip.configMap.namespace }}
  labels:
    {{- include "dynamic-prefix-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dynamic-prefix-operator.fullname" . }}-kubevip
subjects:
  - kind: ServiceAccount
    name: {{ include "dynamic-prefix-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
