# Default values for dynamic-prefix-operator.

# -- Number of replicas. Keep 1 for single-pod installs; set 2+ for warm-standby HA with leader election.
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/pkizzle/dynamic-prefix-operator
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default is the chart appVersion)
  # Left empty on purpose: a floating default such as "main" would pin every
  # install to a continuously overwritten tag rather than to the release the
  # chart was published for.
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""

# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Create a service account
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account (generated if not set)
  name: ""

# -- Pod annotations
podAnnotations: {}

# -- Pod labels
podLabels: {}

# -- Pod security context
# NOTE: Raw ICMPv6 sockets for RA monitoring require root (UID 0) even with
# CAP_NET_RAW. This is a Linux kernel limitation. Similar operators (Cilium,
# Calico) also run as root for network access.
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  # RuntimeDefault, not Unconfined: this process holds NET_RAW, optionally runs
  # in the host network namespace, and parses ICMPv6 and DHCPv6 straight off the
  # wire. The default profile permits everything the raw sockets need -- the
  # kustomize install has always used it.
  seccompProfile:
    type: RuntimeDefault

# -- Container security context
# Both capabilities are load-bearing, for different acquisition methods:
# NET_RAW opens the ICMPv6 socket Router Advertisement monitoring reads, and
# NET_BIND_SERVICE binds UDP 546, the port RFC 8415 gives DHCPv6 clients. Because
# `drop: ALL` takes CAP_NET_BIND_SERVICE away from root as well, leaving it out
# fails the bind with EACCES and the operator never acquires a delegated prefix.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_RAW
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# -- Priority class name
priorityClassName: ""

# ==============================================================================
# Operator Configuration
# ==============================================================================
config:
  # -- Use zap development mode (console-friendly, debug-oriented defaults). Keep false for production-oriented cluster logging.
  logDevelopment: false

  # -- Log encoder (json or console)
  logEncoder: console

  # -- Log level (debug, info, error)
  logLevel: info

  # -- Enable leader election for HA deployments
  leaderElection:
    enabled: true

  # -- Metrics configuration
  metrics:
    # -- Enable metrics endpoint
    enabled: true
    # -- Metrics bind address
    bindAddress: ":8443"
    # -- Serve metrics over HTTPS and require the caller to authenticate, with
    # access decided by TokenReview/SubjectAccessReview. Turning this off exposes
    # unauthenticated plaintext metrics -- and with hostNetwork enabled that
    # listener is on the node's own address.
    secure: true

  # -- Health probe configuration
  health:
    # -- Health probe bind address
    bindAddress: ":8081"

  # -- ServiceSync controller configuration
  serviceSync:
    # -- Optional label selector limiting the Service informer cache.
    # Leave empty to preserve backwards-compatible cluster-wide Service cache behavior.
    # Example: dynamic-prefix.io/name caches only Services labeled with that key.
    cacheLabelSelector: ""

    # -- Annotation keys to publish the external-dns target under, in precedence
    # order. external-dns v0.22 changed its default prefix from
    # `external-dns.alpha.kubernetes.io/` to `external-dns.kubernetes.io/` and
    # provides no fallback, so the correct key is a property of the external-dns
    # you run, not of this operator.
    #
    # The default writes BOTH, which is safe on every version: an external-dns only
    # reads the key its own --annotation-prefix names and ignores the other. Set a
    # single key once your external-dns is settled -- the operator then releases the
    # other from Services that still carry it, which is how a migration is finished.
    # Leave empty to use the operator's default.
    externalDNSTargetAnnotationKeys: []

# ==============================================================================
# kube-vip cloud provider integration
# ==============================================================================
kubevip:
  # -- Manage the kube-vip cloud provider's pool ConfigMap.
  # Off by default: enabling it grants the operator write access to ConfigMaps
  # in the namespace below, which nothing else it does requires. Bind a pool by
  # annotating that ConfigMap with dynamic-prefix.io/name and
  # dynamic-prefix.io/kubevip-key (for example cidr-global).
  enabled: false
  configMap:
    # -- Namespace holding the kube-vip pool ConfigMap.
    namespace: kube-system
    # -- Name of the kube-vip pool ConfigMap.
    name: kubevip

# ==============================================================================
# Network Configuration
# ==============================================================================
network:
  # -- Use host network namespace.
  # Both acquisition methods read the uplink directly: Router Advertisements
  # arrive on the host's interfaces, and the DHCPv6-PD client sources from the
  # host interface's link-local address. In a pod network namespace the operator
  # installs cleanly and then never acquires a prefix, so this defaults on -- the
  # kustomize install has always set it, and the README states it as a
  # requirement. Turn it off only for a deployment that acquires no prefix.
  hostNetwork: true

  # -- DNS policy when using hostNetwork (ClusterFirstWithHostNet recommended)
  dnsPolicy: ""

# ==============================================================================
# Network Policy
# ==============================================================================
networkPolicy:
  # -- Create NetworkPolicy resources
  enabled: false
  # -- Additional ingress rules
  additionalIngress: []
  # -- Additional egress rules
  additionalEgress: []

# ==============================================================================
# Pod Disruption Budget
# ==============================================================================
podDisruptionBudget:
  # -- Create PodDisruptionBudget
  enabled: false
  # -- Minimum available pods
  minAvailable: 1
  # -- Maximum unavailable pods (alternative to minAvailable)
  # maxUnavailable: 0

# ==============================================================================
# Prometheus / Monitoring
# ==============================================================================
serviceMonitor:
  # -- Create ServiceMonitor for Prometheus Operator
  enabled: false
  # -- Additional labels for ServiceMonitor
  additionalLabels: {}
  # -- Scrape interval
  interval: 30s
  # -- Scrape timeout
  scrapeTimeout: 10s
  # -- Metric relabeling configs
  metricRelabelings: []
  # -- Relabeling configs
  relabelings: []
  # -- TLS settings for the scrape when config.metrics.secure is true. The
  # operator serves a self-signed certificate by default, which is why
  # verification is off; point this at a CA bundle (for example one issued by
  # cert-manager) to verify it instead.
  tlsConfig:
    insecureSkipVerify: true
  # -- ServiceAccount Prometheus scrapes with. Setting it makes the chart bind
  # the metrics-reader ClusterRole to that identity, which authenticated scrapes
  # need when config.metrics.secure is true. Leave the name empty to create the
  # role without a binding and grant it yourself.
  scraperServiceAccount:
    name: ""
    namespace: ""

# ==============================================================================
# CRD Installation
# ==============================================================================
crds:
  # -- Install CRDs with the chart
  install: true
  # -- Keep CRDs on chart uninstall
  keep: true
  # -- Annotations for CRDs
  annotations: {}

# ==============================================================================
# RBAC Configuration
# ==============================================================================
rbac:
  # -- Create RBAC resources
  create: true
  # -- Additional rules to add to the ClusterRole
  additionalRules: []
